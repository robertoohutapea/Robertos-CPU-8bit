
# Tiny Tapeout project information

project:
  title: "Roberto's CPU 8-bit"
  author: "Roberto Hutapea"
  discord: ""
  description: "A single-cycle 8-bit CPU with a 16-bit instruction set, four general-purpose registers, ALU, instruction ROM and data memory."
  language: "Verilog"
  clock_hz: 0

# Initial physical design size
tiles: "1x1"

# Top-level module
top_module: "tt_um_robertoohutapea_cpu8"

# Verilog source files inside src/
source_files:
  - "alu_8bit.v"
  - "register_file.v"
  - "program_counter.v"
  - "instruction_memory.v"
  - "instruction_decoder.v"
  - "control_unit.v"
  - "data_memory.v"
  - "cpu_8bit.v"
  - "tt_um_robertoohutapea_cpu8.v"

# Pin configuration
pinout:

  # Inputs
  ui[0]: "Unused"
  ui[1]: "Unused"
  ui[2]: "Unused"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs: Program Counter
  uo[0]: "PC bit 0"
  uo[1]: "PC bit 1"
  uo[2]: "PC bit 2"
  uo[3]: "PC bit 3"
  uo[4]: "PC bit 4"
  uo[5]: "PC bit 5"
  uo[6]: "PC bit 6"
  uo[7]: "PC bit 7"

  # Bidirectional pins
  uio[0]: "CPU HALTED"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
